name: Extract Tadabbur Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_COUNT=$(find . -maxdepth 1 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "Expected exactly one ZIP file in repository root."
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract frontend
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"
          TEMP_DIR="$(mktemp -d)"

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          TOP_DIRS=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            SOURCE_DIR=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)
          else
            SOURCE_DIR="$TEMP_DIR"
          fi

          rm -rf src public
          rm -f index.html package.json vite.config.js README.md
          rm -f DESIGN_NOTES.md BACKEND_CONNECTION.md .env.example

          cp -a "$SOURCE_DIR"/. .

          rm -rf "$TEMP_DIR"

      - name: Remove ZIP and temporary workflow
        shell: bash
        run: |
          set -e

          rm -f "${{ steps.zip.outputs.zip_file }}"
          rm -f ".github/workflows/extract-frontend.yml"

      - name: Commit extracted frontend
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Tadabbur frontend"
          git push
